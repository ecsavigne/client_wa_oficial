version: v2
inputs:
  - directory: v2/types/messenger/proto
plugins:
  # Plugin: Protocol Buffers para Go
  # Genera definiciones de mensajes proto para Go
  - remote: buf.build/protocolbuffers/go
    out: v2/types/messenger/gen
    opt:
      - paths=source_relative
      - default_api_level=API_OPAQUE
      - Mprotoc-gen-openapiv2/options/annotations.proto=github.com/grpc-ecosystem/grpc-gateway/v2/protoc-gen-openapiv2/options

managed:
  enabled: true
  override:
    # - file_option: go_package_prefix
    #   value: github.com/ecsavigne/client_wa_oficial/v2/types/messenger/gen
    - file_option: go_package_prefix
      value: github.com/ecsavigne/client_wa_oficial/v2/types/ig/gen
      path: igpb
    - file_option: go_package_prefix
      value: github.com/ecsavigne/client_wa_oficial/v2/types/general/gen
      path: generalpb
    - file_option: go_package_prefix
      value: github.com/ecsavigne/client_wa_oficial/v2/types/messenger/gen
      path: messengerpb
  disable:
    - file_option: go_package
      module: buf.build/bufbuild/protovalidate
    - module: buf.build/googleapis/googleapis
