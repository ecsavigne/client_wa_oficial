edition = "2023";

package igpb.v1;

import "buf/validate/validate.proto";
import "google/api/field_behavior.proto";

// User represents a user (sender or recipient) in a messaging context
message User {
  // The Instagram-scoped user ID
  string id = 1 [
    (buf.validate.field).string = {min_len: 1},
    (google.api.field_behavior) = REQUIRED
  ];
  // The username of the user
  string username = 2;
  // The self scoped IG user ID
  string self_ig_scoped_id = 3;
}

// QuickReplyPayload contains the selected quick reply information
message QuickReplyPayload {
  // The payload for the specific quick reply that was selected
  string payload = 1 [
    (buf.validate.field).string = {min_len: 1},
    (google.api.field_behavior) = REQUIRED
  ];
}

// WebhookStory represents a story context in a reply
message WebhookStory {
  string url = 1 [(buf.validate.field).string = {uri: true}];
  string id = 2;
}

// WebhookReplyTo represents the reply context of a message
message WebhookReplyTo {
  WebhookStory story = 1;
}

// WebhookMessage represents the message data in a webhook event
message WebhookMessage {
  // The selected quick reply information
  QuickReplyPayload quick_reply = 1;
  // The unique message ID
  string mid = 2 [(buf.validate.field).string = {min_len: 1}];
  // The text, email, or phone number of the message
  string text = 3;
  // Indicates if the message is an echo
  bool is_echo = 4;
  // Indicates if the message is sent by the app user
  bool is_self = 5;
  // Indicates if the message is deleted
  bool is_deleted = 6;
  // Indicates if the message is unsupported
  bool is_unsupported = 7;
  // The reply context if this message is a reply
  WebhookReplyTo reply_to = 8;
}

// WebhookPostback represents a postback event in the webhook
message WebhookPostback {
  string title = 1;
  string payload = 2;
  string mid = 3;
}

// WebhookReaction represents a reaction event in the webhook
message WebhookReaction {
  string mid = 1;
  string action = 2;
  string reaction = 3;
  string emoji = 4;
}

// WebhookRead represents a read event in the webhook
message WebhookRead {
  string mid = 1;
}

// WebhookMessageEdit represents a message edit event in the webhook
message WebhookMessageEdit {
  string mid = 1;
  string text = 2;
  int32 num_edit = 3;
}

// WebhookReferral represents a referral event in the webhook
message WebhookReferral {
  string ref = 1;
  string source = 2;
  string type = 3;
}

// MessagingItem represents a single messaging event in the webhook
message MessagingItem {
  // The user who sent the message
  User sender = 1 [(google.api.field_behavior) = REQUIRED];
  // The user who is receiving the message (Instagram Professional account)
  User recipient = 2 [(google.api.field_behavior) = REQUIRED];
  // Unix timestamp when the message was sent
  int64 timestamp = 3 [(google.api.field_behavior) = REQUIRED];
  // The message content
  WebhookMessage message = 4;
  // Indicates if the event was generated by the app user
  bool is_self = 5;
  // The postback content
  WebhookPostback postback = 6;
  // The reaction content
  WebhookReaction reaction = 7;
  // The read content
  WebhookRead read = 8;
  // The message edit content
  WebhookMessageEdit message_edit = 9;
  // The referral content
  WebhookReferral referral = 10;
}

// WebhookChange represents a change event in the webhook
message WebhookChange {
  string field = 1;
  WebhookValue value = 2;
}

// Entry represents an entry in the webhook payload
message Entry {
  // The ID for the Instagram Professional account that owns the quick replies
  string id = 1 [
    (buf.validate.field).string = {min_len: 1},
    (google.api.field_behavior) = REQUIRED
  ];
  // The time the notification was sent (Unix timestamp in milliseconds)
  int64 time = 2 [(google.api.field_behavior) = REQUIRED];
  // Array of messaging items in this entry
  repeated MessagingItem messaging = 3 [(google.api.field_behavior) = REQUIRED];
  // The value object for non-messaging events like comments
  WebhookValue value = 4;
  // Array of changes in this entry
  repeated WebhookChange changes = 5;
  // The field that changed (for specific webhook payloads)
  string field = 6;
}

// WebhookValue represents the value object in a webhook entry
message WebhookValue {
  string id = 1;
  User from = 2;
  string text = 3;
  WebhookMedia media = 4;
}

// WebhookMedia represents the media associated with a webhook event
message WebhookMedia {
  string id = 1;
  string media_product_type = 2;
}

// InstagramWebhookEvent represents the complete webhook event payload received from Instagram
message InstagramWebhookEvent {
  // The object type (always "instagram" for Instagram webhooks)
  string object = 1 [
    (buf.validate.field).string = {
      min_len: 1
      pattern: "^instagram$"
    },
    (google.api.field_behavior) = REQUIRED
  ];
  // Array of entries containing the webhook data
  repeated Entry entry = 2 [(google.api.field_behavior) = REQUIRED];
}
