version: v2
inputs:
  - directory: v2/types/ig/proto
plugins:
  # Plugin: Protocol Buffers para Go
  # Genera definiciones de mensajes proto para Go
  - remote: buf.build/protocolbuffers/go
    out: v2/types/ig/gen
    opt:
      - paths=source_relative
      # values: API_OPAQUE, API_HYBRID, API_OPEN
      - default_api_level=API_HYBRID
      - Mprotoc-gen-openapiv2/options/annotations.proto=github.com/grpc-ecosystem/grpc-gateway/v2/protoc-gen-openapiv2/options
      - Mgeneralpb/v1/general_file_header.proto=github.com/ecsavigne/client_wa_oficial/v2/types/general/gen/generalpb/v1
      - Mgeneralpb/v1/general_file_descriptor.proto=github.com/ecsavigne/client_wa_oficial/v2/types/general/gen/generalpb/v1

managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/ecsavigne/client_wa_oficial/v2/types/ig/gen
      path: igpb
    - file_option: go_package_prefix
      value: github.com/ecsavigne/client_wa_oficial/v2/types/general/gen
      path: generalpb
  disable:
    - file_option: go_package
      module: buf.build/bufbuild/protovalidate
    - module: buf.build/googleapis/googleapis
